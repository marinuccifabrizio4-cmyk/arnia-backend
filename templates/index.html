<!DOCTYPE html>
<html>
<head>
    <title>🐝 Beehive Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f5f5f5;
        }

        #status {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 20px;
            background-color: red;
            color: white;
            font-weight: bold;
            margin: 15px;
        }

        .values {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 20px;
        }

        .box {
            background: white;
            padding: 15px;
            border-radius: 10px;
            width: 150px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        canvas {
            max-width: 700px;
            margin: 20px auto;
            background: white;
            border-radius: 10px;
            padding: 10px;
        }
    </style>
</head>

<body>

<h1>Arnia intelligente</h1>
<div style="margin-top:20px;">
    <img src="/static/logo.png" width="120">
</div>
<div id="status">Disconnesso</div>

<div class="values">

    <div class="box">
        <h3>Temp</h3>
        <div id="tempValue">--</div>
    </div>

    <div class="box">
        <h3>Umidita'</h3>
        <div id="humValue">--</div>
    </div>

    <div class="box">
        <h3>Peso</h3>
        <div id="weightValue">--</div>
    </div>

</div>

<h3>Temperatura</h3>
<canvas id="tempChart"></canvas>

<h3>Umidita'</h3>
<canvas id="humChart"></canvas>

<h3>Peso</h3>
<canvas id="weightChart"></canvas>

<script src="/static/app.js"></script>

</body>
</html>
